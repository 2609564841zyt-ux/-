.identity-badge {
  position: fixed;
  z-index: var(--z-badge);
  top: 0;
  right: clamp(34px, 5.4vw, 88px);
  width: clamp(164px, 13.5vw, 208px);
  color: #171313;
  pointer-events: none;
  transform: translateY(calc(-100% - 24px));
  transform-origin: 50% 0;
  will-change: transform;
}

.identity-badge.is-dropped {
  animation: badge-drop 940ms cubic-bezier(.16, 1, .3, 1) forwards;
}

.badge-lanyard {
  position: relative;
  width: 38px;
  height: clamp(94px, 16vh, 148px);
  margin: 0 auto;
}

.badge-lanyard i {
  position: absolute;
  top: -12px;
  bottom: 0;
  width: 9px;
  background: #171313;
}

.badge-lanyard i:first-child {
  left: 7px;
  transform: rotate(-5deg);
  transform-origin: top;
}

.badge-lanyard i:last-child {
  right: 7px;
  transform: rotate(5deg);
  transform-origin: top;
}

.badge-hardware {
  position: relative;
  z-index: 2;
  width: 38px;
  height: 30px;
  margin: -4px auto -7px;
  border-radius: 5px 5px 9px 9px;
  background: #a6a5a2;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18);
}

.badge-hardware::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 50%;
  width: 14px;
  height: 7px;
  border: 2px solid #5d5c59;
  border-radius: 999px;
  transform: translateX(-50%);
}

.badge-hardware span {
  position: absolute;
  inset: auto 8px -7px;
  height: 10px;
  border-radius: 0 0 5px 5px;
  background: #787774;
}

.badge-card {
  position: relative;
  min-height: clamp(220px, 27vh, 278px);
  padding: clamp(15px, 1.3vw, 20px);
  overflow: hidden;
  border-radius: 11px;
  background: #efefed;
  box-shadow: 0 8px 8px rgba(17, 13, 13, .22);
  transform-origin: 50% -8px;
}

.identity-badge.is-dropped .badge-card {
  animation: badge-sway 1100ms 260ms cubic-bezier(.16, 1, .3, 1) both;
}

.badge-card::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 42%;
  height: 8px;
  background: #171313;
}

.badge-card-header,
.badge-card-footer {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  font-size: clamp(.52rem, .55vw, .66rem);
  font-weight: 750;
  line-height: 1.24;
}

.badge-card-header > :last-child { text-align: right; }

.badge-monogram {
  font-family: "Futura LT ExtraBold", "Arial Black", sans-serif;
  font-size: clamp(1rem, 1.2vw, 1.35rem);
  letter-spacing: -.04em;
  line-height: .9;
}

.badge-contact {
  position: absolute;
  top: 30%;
  right: 14px;
  left: 14px;
  text-align: center;
}

.badge-contact strong {
  display: block;
  margin-bottom: .4em;
  font-size: clamp(.9rem, 1.1vw, 1.08rem);
  font-weight: 800;
  letter-spacing: .02em;
  line-height: 1.2;
  white-space: nowrap;
}

.badge-contact span {
  display: block;
  font-size: clamp(.48rem, .52vw, .6rem);
  font-weight: 700;
  letter-spacing: .08em;
  line-height: 1.2;
}

.badge-qr {
  position: absolute;
  right: auto;
  bottom: clamp(48px, 5.4vh, 56px);
  left: 50%;
  width: clamp(64px, 5.8vw, 84px);
  aspect-ratio: 1;
  overflow: hidden;
  background: #fff;
  transform: translateX(-50%);
}

.badge-qr img {
  position: absolute;
  top: -44.5%;
  left: -18.5%;
  display: block;
  width: 136.9%;
  max-width: none;
  height: auto;
}

.badge-card-footer {
  position: absolute;
  right: clamp(15px, 1.3vw, 20px);
  bottom: clamp(14px, 1.2vw, 18px);
  left: clamp(15px, 1.3vw, 20px);
  align-items: flex-end;
  padding-top: 9px;
  border-top: 1px solid rgba(23, 19, 19, .28);
}

@keyframes badge-drop {
  from { transform: translateY(calc(-100% - 24px)); }
  to { transform: translateY(0); }
}

@keyframes badge-sway {
  0% { transform: rotate(-5deg); }
  56% { transform: rotate(1.8deg); }
  100% { transform: rotate(0); }
}

function paint(){
 let ds=selected();if(!ds.length)return;if(index>=ds.length)index=0;
 const carousel=$('carousel'),cards=[...carousel.querySelectorAll('[data-card]')];
 const needsRebuild=cards.length!==ds.length||cards.some((card,i)=>card.dataset.key!==ds[i].title);
 if(needsRebuild)carousel.innerHTML=ds.map((p,i)=>`<button class="work-card" data-card="${i}" data-key="${p.title}" aria-label="${p.title}">${p.mediaType==='video'?`<video src="${p.cover}" muted playsinline loop autoplay preload="metadata"></video>`:`<img draggable="false" src="${p.cover}" alt="${p.title}封面">`}</button>`).join('');
 content.querySelectorAll('[data-card]').forEach(b=>{
  let i=+b.dataset.card,d=(i-index+ds.length)%ds.length;if(d>ds.length/2)d-=ds.length;let a=Math.abs(d);
  b.classList.toggle('current',a===0);b.setAttribute('aria-label',ds[i].title+(a===0?'，打开完整作品':''));
  b.style.transform=`translate(calc(-50% + ${d*(innerWidth<700?30:23)}%), -50%) scale(${a===0?1:a===1?.82:.66}) rotateY(${d===0?0:d>0?-17:17}deg)`;
  b.style.zIndex=10-a;b.style.opacity=a>2?0:a===2?.72:1;b.style.visibility=a>2?'hidden':'visible';b.tabIndex=a===0?0:-1;
  b.onclick=()=>{if(Math.abs(lastPointerDistance)>40)return;index=i;paint();detail(ds[i])};
 });
 $('workName').textContent=ds[index].title;$('workSummary').textContent=ds[index].summary;
 $('count').textContent=String(index+1).padStart(2,'0')+' / '+String(ds.length).padStart(2,'0');
}

  else{interactive.hidden=true;frame.hidden=false;frame.src='about:blank';intro.pause();intro.removeAttribute('src');$('detailPdf').hidden=true;$('detailPdf').src='';$('detailImage').hidden=false;$('detailImage').src=p.full||'';$('detailImage').alt=p.title+'完整项目展示';try{await $('detailImage').decode()}catch{}}
 }

const didiCanvas=$('didiCanvas'),didiShell=$('didiCanvasShell'),didiStage=$('didiCanvasStage'),didiImage=$('didiCanvasImage');
let didiScale=1,didiX=0,didiY=0,didiFitScale=1,didiPointers=new Map(),didiPinch=null;
function renderDidiCanvas(){didiStage.style.transform=`translate(${didiX}px,${didiY}px) scale(${didiScale})`;$('didiCanvasZoom').textContent=Math.round(didiScale*100)+'%'}
function fitDidiCanvas(){
 const w=didiImage.naturalWidth||3572,h=didiImage.naturalHeight||2072,pad=32;
 didiFitScale=Math.min((didiShell.clientWidth-pad*2)/w,(didiShell.clientHeight-pad*2)/h,1);didiScale=didiFitScale;didiX=(didiShell.clientWidth-w*didiScale)/2;didiY=(didiShell.clientHeight-h*didiScale)/2;renderDidiCanvas()
}
function zoomDidi(next,cx=didiShell.clientWidth/2,cy=didiShell.clientHeight/2){
 next=Math.min(Math.max(next,didiFitScale*.55),4);const ratio=next/didiScale;didiX=cx-(cx-didiX)*ratio;didiY=cy-(cy-didiY)*ratio;didiScale=next;renderDidiCanvas()
}
didiShell.addEventListener('wheel',e=>{e.preventDefault();const r=didiShell.getBoundingClientRect();zoomDidi(didiScale*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
didiShell.addEventListener('pointerdown',e=>{didiShell.setPointerCapture(e.pointerId);didiPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});didiShell.classList.add('is-dragging');if(didiPointers.size===2){const p=[...didiPointers.values()];didiPinch={distance:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),scale:didiScale}}});
didiShell.addEventListener('pointermove',e=>{const prev=didiPointers.get(e.pointerId);if(!prev)return;didiPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(didiPointers.size===1){didiX+=e.clientX-prev.x;didiY+=e.clientY-prev.y;renderDidiCanvas()}else if(didiPointers.size===2&&didiPinch){const p=[...didiPointers.values()],midX=(p[0].x+p[1].x)/2,midY=(p[0].y+p[1].y)/2;zoomDidi(didiPinch.scale*Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)/didiPinch.distance,midX,midY)}});
function endDidiPointer(e){didiPointers.delete(e.pointerId);didiPinch=null;if(!didiPointers.size)didiShell.classList.remove('is-dragging')}
didiShell.addEventListener('pointerup',endDidiPointer);didiShell.addEventListener('pointercancel',endDidiPointer);
didiCanvas.querySelectorAll('[data-didi-zoom]').forEach(button=>button.onclick=()=>zoomDidi(didiScale*(button.dataset.didiZoom==='in'?1.25:.8)));
didiCanvas.querySelector('[data-didi-fit]').onclick=fitDidiCanvas;$('closeDidiCanvas').onclick=()=>didiCanvas.close();
didiCanvas.addEventListener('dblclick',fitDidiCanvas);didiCanvas.addEventListener('close',()=>{didiPointers.clear();didiShell.classList.remove('is-dragging')});

async function openExperience(){
